AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Fit Forge API staging environment

Parameters:
  DatabaseUrlParameterName:
    Type: String
    Default: /fit-forge/staging/DATABASE_URL
  CorsOrigins:
    Type: String
    Default: ""

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    MemorySize: 1024
    Timeout: 30
    Environment:
      Variables:
        NODE_ENV: staging
        CORS_ORIGINS: !Ref CorsOrigins
        DATABASE_URL: !Sub "{{resolve:ssm-secure:${DatabaseUrlParameterName}}}"

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/lambda.handler
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
            PayloadFormatVersion: "2.0"
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
            PayloadFormatVersion: "2.0"

Outputs:
  ApiUrl:
    Description: Staging API URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
